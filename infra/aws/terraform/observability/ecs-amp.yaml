receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: video-api
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8080"]
        - job_name: video-processor
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8081"]
        - job_name: notification-worker
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8082"]

exporters:
  prometheus_remote_write:
    endpoint: ${env:AMP_ENDPOINT}
    auth:
      authenticator: sigv4auth

extensions:
  sigv4auth:
    region: ${env:AWS_REGION}
    service: aps

service:
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheus_remote_write]
