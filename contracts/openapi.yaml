openapi: 3.1.0
info: { title: FIAP X Video API, version: 0.1.0 }
servers: [ { url: 'http://localhost:8080' } ]
paths:
  /v1/auth/register:
    post:
      summary: Cadastra uma conta USER
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '201': { description: Conta criada, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/login:
    post:
      summary: Autentica e inicia uma sessão
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: Autenticado, headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /v1/auth/refresh:
    post:
      summary: Rotaciona o refresh token e emite um access token
      parameters:
        - { name: FIAPX_REFRESH, in: cookie, required: true, schema: { type: string } }
        - { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Token renovado, headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AccessToken' } } } }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/AccessDenied' }
  /v1/auth/logout:
    post:
      summary: Revoga a sessão do cookie atual
      parameters:
        - { name: FIAPX_REFRESH, in: cookie, required: false, schema: { type: string } }
        - { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string } }
      responses:
        '204': { description: Sessão encerrada, headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } } }
        '403': { $ref: '#/components/responses/AccessDenied' }
  /v1/me:
    get:
      summary: Recupera a conta autenticada pelo bearer token
      security: [ { bearerAuth: [ ] } ]
      responses:
        '200': { description: Conta autenticada, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/videos:
    get:
      summary: Lista os vídeos do proprietário autenticado em páginas numeradas
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: Página de vídeos de produto, content: { application/json: { schema: { $ref: '#/components/schemas/VideoLibraryPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/videos/{videoRef}:
    get:
      summary: Consulta o detalhe de produto de um vídeo do proprietário
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - { name: videoRef, in: path, required: true, schema: { type: string }, description: Referência opaca Base64 URL-safe; não é UUID }
      responses:
        '200': { description: Detalhe de produto, content: { application/json: { schema: { $ref: '#/components/schemas/VideoLibraryDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/videos/uploads:
    post:
      summary: Reserva uma chave opaca e autoriza upload direto ao object storage
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoUploadRequest' }
      responses:
        '201':
          description: Vídeo pendente e autorização temporária de PUT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoUpload' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/videos/{videoId}/confirm:
    post:
      summary: Confirma objeto existente e metadados antes da criação de job
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - { name: videoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Vídeo confirmado; repetição retorna a mesma representação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedVideo' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /v1/jobs:
    get:
      summary: Lista jobs do proprietário por cursor
      security: [ { bearerAuth: [ ] } ]
      parameters: [ { name: cursor, in: query, required: false, schema: { type: string } }, { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } } ]
      responses: { '200': { description: Página de jobs, content: { application/json: { schema: { $ref: '#/components/schemas/JobPage' } } } }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      summary: Cria um job a partir de um objeto já enviado
      security: [ { bearerAuth: [ ] } ]
      parameters: [ { name: Idempotency-Key, in: header, required: false, description: Chave opaca (até 128 caracteres) para repetir a criação com segurança, schema: { type: string, maxLength: 128 } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ sourceKey ], properties: { sourceKey: { type: string } } } } } }
      responses: { '201': { description: Job criado ou recuperado para a mesma chave de idempotência, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/jobs/{id}:
    get:
      summary: Consulta o estado de um job
      security: [ { bearerAuth: [ ] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Estado atual, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  headers:
    RefreshCookie: { description: Cookie FIAPX_REFRESH HttpOnly; também pode expirar os cookies de sessão, schema: { type: string } }
  responses:
    ValidationError: { description: Dados inválidos, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    AuthenticationFailed: { description: Credenciais ou sessão inválidas, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Bearer token inválido ou ausente, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    AccessDenied: { description: CSRF ou autorização inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Vídeo ou recurso não encontrado para o proprietário, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Estado incompatível, e-mail já cadastrado, chave de idempotência reutilizada com outro payload, vídeo não confirmado ou segundo processamento, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    StorageUnavailable: { description: Object storage temporariamente indisponível, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    VideoUploadRequest:
      type: object
      required: [ originalFilename, contentType, sizeBytes ]
      properties:
        originalFilename: { type: string, minLength: 1, maxLength: 512 }
        contentType: { type: string, enum: [ video/mp4, video/quicktime, video/webm, video/x-matroska ] }
        sizeBytes: { type: integer, minimum: 1, maximum: 500000000 }
        checksumSha256: { type: [ string, 'null' ], pattern: '^[0-9a-fA-F]{64}$' }
    VideoUpload:
      type: object
      required: [ videoId, sourceKey, uploadUrl, expiresAt, method, headers ]
      properties:
        videoId: { type: string, format: uuid }
        sourceKey: { type: string }
        uploadUrl: { type: string, format: uri, description: Credencial temporária; não persistir nem registrar }
        expiresAt: { type: string, format: date-time }
        method: { type: string, enum: [ PUT ] }
        headers: { type: object, additionalProperties: { type: string }, description: Enviar exatamente com o PUT }
    ConfirmedVideo:
      type: object
      required: [ videoId, sourceKey, status, uploadedAt ]
      properties:
        videoId: { type: string, format: uuid }
        sourceKey: { type: string }
        status: { type: string, enum: [ UPLOADED ] }
        uploadedAt: { type: string, format: date-time }
    Credentials: { type: object, required: [ email, password ], properties: { email: { type: string, format: email }, password: { type: string, minLength: 8, maxLength: 128, writeOnly: true } } }
    User: { type: object, required: [ id, email, roles ], properties: { id: { type: string, format: uuid }, email: { type: string, format: email }, roles: { type: array, items: { enum: [ USER, ADMIN ] } } } }
    AccessToken: { type: object, required: [ accessToken, tokenType, expiresIn ], properties: { accessToken: { type: string }, tokenType: { type: string, example: Bearer }, expiresIn: { type: integer, example: 900 } } }
    Login: { allOf: [ { $ref: '#/components/schemas/AccessToken' }, { type: object, required: [ user ], properties: { user: { $ref: '#/components/schemas/User' } } } ] }
    Problem: { type: object, properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string } } }
    Job: { type: object, properties: { id: { type: string, format: uuid }, userId: { type: string, format: uuid }, sourceKey: { type: string }, resultKey: { type: [ string, 'null' ] }, status: { enum: [ PENDING, PROCESSING, COMPLETED, FAILED ] }, createdAt: { type: string, format: date-time } } }
    JobPage: { type: object, required: [ items ], properties: { items: { type: array, items: { $ref: '#/components/schemas/Job' } }, nextCursor: { type: [ string, 'null' ] } } }
    VideoLibraryStatus: { type: string, enum: [ AWAITING_UPLOAD, UPLOADED, PROCESSING, AVAILABLE, FAILED, REJECTED, EXPIRED ] }
    VideoProcessingStatus: { type: string, enum: [ QUEUED, PROCESSING, AVAILABLE, FAILED ] }
    VideoLibraryItem:
      type: object
      required: [ videoRef, originalFilename, status, submittedAt, activityAt ]
      properties:
        videoRef: { type: string }
        originalFilename: { type: string }
        status: { $ref: '#/components/schemas/VideoLibraryStatus' }
        submittedAt: { type: string, format: date-time }
        activityAt: { type: string, format: date-time }
    VideoLibraryPage:
      type: object
      required: [ items, page, pageSize, totalItems, totalPages ]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VideoLibraryItem' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [ 5 ] }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ProcessingView:
      type: object
      required: [ status, requestedAt, startedAt, finishedAt ]
      properties:
        status: { $ref: '#/components/schemas/VideoProcessingStatus' }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [ string, 'null' ], format: date-time }
        finishedAt: { type: [ string, 'null' ], format: date-time }
    VideoLibraryDetail:
      type: object
      required: [ videoRef, originalFilename, status, submittedAt, uploadedAt, processing ]
      properties:
        videoRef: { type: string }
        originalFilename: { type: string }
        status: { $ref: '#/components/schemas/VideoLibraryStatus' }
        submittedAt: { type: string, format: date-time }
        uploadedAt: { type: [ string, 'null' ], format: date-time }
        processing: { anyOf: [ { $ref: '#/components/schemas/ProcessingView' }, { type: 'null' } ] }
