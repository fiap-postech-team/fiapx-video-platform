openapi: 3.1.0
info: { title: FIAP X Video API, version: 0.1.0 }
servers: [ { url: http://localhost:8080 } ]
paths:
  /v1/auth/register:
    post:
      summary: Cadastra uma conta USER
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '201': { description: Conta criada, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/login:
    post:
      summary: Autentica e inicia uma sessão
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: Autenticado, headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
  /v1/auth/refresh:
    post:
      summary: Rotaciona o refresh token e emite um access token
      parameters:
        - { name: FIAPX_REFRESH, in: cookie, required: true, schema: { type: string } }
        - { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Token renovado, headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AccessToken' } } } }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/AccessDenied' }
  /v1/auth/logout:
    post:
      summary: Revoga a sessão do cookie atual
      parameters:
        - { name: FIAPX_REFRESH, in: cookie, required: false, schema: { type: string } }
        - { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string } }
      responses:
        '204': { description: Sessão encerrada, headers: { Set-Cookie: { $ref: '#/components/headers/RefreshCookie' } } }
        '403': { $ref: '#/components/responses/AccessDenied' }
  /v1/jobs:
    post:
      summary: Cria um job a partir de um objeto já enviado
      security: [ { bearerAuth: [ ] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ sourceKey ], properties: { sourceKey: { type: string } } } } } }
      responses: { '201': { description: Job criado, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/jobs/{id}:
    get:
      summary: Consulta o estado de um job
      security: [ { bearerAuth: [ ] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Estado atual, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  headers:
    RefreshCookie: { description: Cookie FIAPX_REFRESH HttpOnly; também pode expirar os cookies de sessão, schema: { type: string } }
  responses:
    ValidationError: { description: Dados inválidos, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    AuthenticationFailed: { description: Credenciais ou sessão inválidas, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Bearer token inválido ou ausente, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    AccessDenied: { description: CSRF ou autorização inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: E-mail já cadastrado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Credentials: { type: object, required: [ email, password ], properties: { email: { type: string, format: email }, password: { type: string, minLength: 12, maxLength: 128, writeOnly: true } } }
    User: { type: object, required: [ id, email, roles ], properties: { id: { type: string, format: uuid }, email: { type: string, format: email }, roles: { type: array, items: { enum: [ USER, ADMIN ] } } } }
    AccessToken: { type: object, required: [ accessToken, tokenType, expiresIn ], properties: { accessToken: { type: string }, tokenType: { type: string, example: Bearer }, expiresIn: { type: integer, example: 900 } } }
    Login: { allOf: [ { $ref: '#/components/schemas/AccessToken' }, { type: object, required: [ user ], properties: { user: { $ref: '#/components/schemas/User' } } } ] }
    Problem: { type: object, properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string } } }
    Job: { type: object, properties: { id: { type: string, format: uuid }, userId: { type: string, format: uuid }, sourceKey: { type: string }, resultKey: { type: [ string, 'null' ] }, status: { enum: [ PENDING, PROCESSING, COMPLETED, FAILED ] }, createdAt: { type: string, format: date-time } } }
