asyncapi: 3.0.0
info: { title: FIAP X asynchronous contracts, version: 1.0.0 }
channels:
  jobRequested: { address: video.job.requested.v1, messages: { event: { $ref: '#/components/messages/JobRequested' } } }
  jobStarted: { address: video.job.started.v1, messages: { event: { $ref: '#/components/messages/JobResult' } } }
  jobCompleted: { address: video.job.completed.v1, messages: { event: { $ref: '#/components/messages/JobResult' } } }
  jobFailed: { address: video.job.failed.v1, messages: { event: { $ref: '#/components/messages/JobResult' } } }
operations:
  requestProcessing: { action: send, channel: { $ref: '#/channels/jobRequested' } }
  consumeRequested: { action: receive, channel: { $ref: '#/channels/jobRequested' } }
  consumeStarted: { action: receive, channel: { $ref: '#/channels/jobStarted' } }
  consumeCompleted: { action: receive, channel: { $ref: '#/channels/jobCompleted' } }
  consumeFailed: { action: receive, channel: { $ref: '#/channels/jobFailed' } }
components:
  messages:
    JobRequested:
      payload:
        type: object
        required: [ eventId, jobId, userId, sourceKey ]
        properties:
          eventId: { type: string, format: uuid }
          jobId: { type: string, format: uuid }
          userId: { type: string, format: uuid }
          videoId: { type: string, format: uuid }
          sourceKey: { type: string }
          recipient: { type: string, format: email }
          videoName: { type: string, minLength: 1, maxLength: 512 }
          type: { type: string, enum: [ video.job.requested.v1 ] }
          schemaVersion: { type: integer, enum: [ 1 ] }
          occurredAt: { type: string, format: date-time }
          correlationId: { type: string, format: uuid }
    JobResult: { payload: { type: object, required: [ eventId, jobId, type ], properties: { eventId: { type: string, format: uuid }, jobId: { type: string, format: uuid }, type: { enum: [ PROCESSING, COMPLETED, FAILED ] }, schemaVersion: { type: integer, enum: [ 1 ], default: 1 }, occurredAt: { type: string, format: date-time }, correlationId: { type: string, format: uuid }, resultKey: { type: string, minLength: 1 }, terminal: { type: boolean }, reason: { type: string }, reasonCode: { type: string, enum: [ INVALID_MEDIA, SOURCE_UNAVAILABLE, RESULT_UPLOAD_FAILED, PROCESSING_FAILED ] }, recipient: { type: string, format: email }, videoName: { type: string, minLength: 1, maxLength: 512 } } } }
