spring:
  application:
    name: video-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    rabbit:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    issuer: ${APP_AUTH_ISSUER:}
    audience: ${APP_AUTH_AUDIENCE:}
    key-id: ${APP_AUTH_KEY_ID:}
    private-key-base64: ${APP_AUTH_PRIVATE_KEY_BASE64:}
    public-key-base64: ${APP_AUTH_PUBLIC_KEY_BASE64:}
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:7d}
    lock-duration: ${APP_AUTH_LOCK_DURATION:15m}
    max-failures: ${APP_AUTH_MAX_FAILURES:5}
    bootstrap:
      enabled: ${APP_AUTH_BOOTSTRAP_ENABLED:false}
      email: ${APP_AUTH_BOOTSTRAP_EMAIL:}
      password: ${APP_AUTH_BOOTSTRAP_PASSWORD:}
