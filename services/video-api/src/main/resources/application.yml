server.port: ${SERVER_PORT:8080}
spring:
  application.name: video-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fiapx}
    username: ${DATABASE_USER:fiapx}
    password: ${DATABASE_PASSWORD:fiapx}
  jpa.hibernate.ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:fiapx}
    password: ${RABBITMQ_PASSWORD:fiapx}
app.security.jwt-secret: ${JWT_SECRET:change-me-with-at-least-32-characters}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
