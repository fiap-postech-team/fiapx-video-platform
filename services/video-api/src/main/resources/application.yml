spring:
  application:
    name: video-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    rabbit:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  video:
    max-size-bytes: ${APP_VIDEO_MAX_SIZE_BYTES:500000000}
    allowed-content-types: ${APP_VIDEO_ALLOWED_CONTENT_TYPES:video/mp4,video/quicktime,video/webm,video/x-matroska}
    upload-url-ttl: ${APP_VIDEO_UPLOAD_URL_TTL:PT15M}
    pending-ttl: ${APP_VIDEO_PENDING_TTL:PT24H}
    cleanup-batch-size: ${APP_VIDEO_CLEANUP_BATCH_SIZE:100}
    cleanup-interval: ${APP_VIDEO_CLEANUP_INTERVAL:PT5M}
    bucket: ${S3_BUCKET:videos}
    internal-endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  auth:
    issuer: ${APP_AUTH_ISSUER:}
    audience: ${APP_AUTH_AUDIENCE:}
    key-id: ${APP_AUTH_KEY_ID:}
    private-key-base64: ${APP_AUTH_PRIVATE_KEY_BASE64:}
    public-key-base64: ${APP_AUTH_PUBLIC_KEY_BASE64:}
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:7d}
    lock-duration: ${APP_AUTH_LOCK_DURATION:15m}
    max-failures: ${APP_AUTH_MAX_FAILURES:5}
    bootstrap:
      enabled: ${APP_AUTH_BOOTSTRAP_ENABLED:false}
      email: ${APP_AUTH_BOOTSTRAP_EMAIL:}
      password: ${APP_AUTH_BOOTSTRAP_PASSWORD:}
