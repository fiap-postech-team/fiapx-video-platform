spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/fiapx
    username: fiapx
    password: fiapx

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    url: /openapi.yaml
    try-it-out-enabled: false

app:
  auth:
    issuer: http://localhost:8080
    audience: fiapx-video-api
    key-id: local-development
