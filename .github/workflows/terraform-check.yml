name: terraform-check

on:
  push:
    branches: ["**"]
    paths:
      - "infra/aws/**"
      - ".github/workflows/terraform-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/aws/**"
      - ".github/workflows/terraform-check.yml"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3
      - name: Terraform format
        run: terraform fmt -check -recursive infra/aws/terraform
      - name: Initialize without backend
        working-directory: infra/aws/terraform/environments/production
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra/aws/terraform/environments/production
        run: terraform validate
      - name: Validate Terraform bootstrap
        working-directory: infra/aws/terraform/bootstrap
        run: terraform init -backend=false && terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        working-directory: infra/aws/terraform/environments/production
        run: tflint --init && tflint
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/aws/terraform
          framework: terraform
          soft_fail: false

  plan:
    if: ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref != 'refs/heads/main')) && vars.AWS_PLAN_ROLE_ARN != '' && vars.TERRAFORM_STATE_BUCKET != '' && vars.ROOT_DOMAIN != '' && vars.ALERT_EMAIL != '' && vars.DEFAULT_NOTIFICATION_RECIPIENT != ''
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Terraform init
        working-directory: infra/aws/terraform/environments/production
        run: terraform init -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" -backend-config="key=fiapx-video-platform/production/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Terraform plan
        working-directory: infra/aws/terraform/environments/production
        env:
          TF_VAR_terraform_state_bucket_name: ${{ vars.TERRAFORM_STATE_BUCKET }}
          TF_VAR_root_domain: ${{ vars.ROOT_DOMAIN }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_default_notification_recipient: ${{ vars.DEFAULT_NOTIFICATION_RECIPIENT }}
          TF_VAR_jwt_private_key_base64: ${{ secrets.JWT_PRIVATE_KEY_BASE64 }}
          TF_VAR_jwt_public_key_base64: ${{ secrets.JWT_PUBLIC_KEY_BASE64 }}
          TF_VAR_ses_smtp_username: ${{ secrets.SES_SMTP_USERNAME }}
          TF_VAR_ses_smtp_password: ${{ secrets.SES_SMTP_PASSWORD }}
          TF_VAR_api_image: public.ecr.aws/docker/library/busybox:latest
          TF_VAR_processor_image: public.ecr.aws/docker/library/busybox:latest
          TF_VAR_notification_image: public.ecr.aws/docker/library/busybox:latest
          TF_VAR_collector_image: public.ecr.aws/aws-observability/aws-otel-collector:latest
        run: terraform plan -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: infra/aws/terraform/environments/production/tfplan
          retention-days: 7
