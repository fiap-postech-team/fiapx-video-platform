name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/video-api-frontend/package-lock.json
      - name: Install dependencies
        working-directory: services/video-api-frontend
        run: npm ci
      - name: Lint
        working-directory: services/video-api-frontend
        run: npm run lint -- --max-warnings=0
      - name: Test with coverage
        working-directory: services/video-api-frontend
        run: npm run test:coverage
      - name: Build
        working-directory: services/video-api-frontend
        run: npm run build
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: services/video-api-frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java services
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Upload backend analysis data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-analysis
          path: |
            services/*/target/classes/**
            services/*/target/generated-sources/**
            services/*/target/site/jacoco/jacoco.xml
            services/*/target/spotbugs-medium.xml
            services/*/target/spotbugs-high.xml
          if-no-files-found: warn
          retention-days: 7

  sonar:
    name: sonar
    needs: [frontend, backend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download frontend coverage
        uses: actions/download-artifact@v7
        with:
          name: frontend-coverage
          path: services/video-api-frontend/coverage
      - name: Download backend analysis data
        uses: actions/download-artifact@v7
        with:
          name: backend-analysis
          path: services
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
